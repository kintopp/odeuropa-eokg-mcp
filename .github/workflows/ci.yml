name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Offline only: EOKG_LIVE tests hit a public research endpoint with a 60 s gateway and no SLA; run them locally before releases.
      - run: npm test
